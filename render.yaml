# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: off

services:
  - type: web
    name: opencode-llm-proxy
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: OPENCODE_LLM_PROXY_TOKEN
        generateValue: true
      - key: OPENCODE_LLM_PROXY_HOST
        value: 0.0.0.0
      # Set at least one provider key so the proxy has a model to serve.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
